<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ماجراجویی واژه‌ها | پایه سوم</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#dff7ff,#f9e4ff,#fff4d8);min-height:100vh;color:#26345b}.wrap{max-width:760px;margin:24px auto;padding:18px}.panel{background:#ffffffed;border-radius:28px;box-shadow:0 14px 40px #56549a26;padding:26px;text-align:center;border:3px solid white}h1{color:#6843b5;margin:4px 0 8px}.sub{line-height:2}.badge{display:inline-block;background:#efe7ff;border-radius:30px;padding:9px 16px;margin:8px;font-weight:bold}.progress{height:15px;background:#e9e9f6;border-radius:20px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#35c9a7,#8a70f5);transition:.3s}.question{font-size:22px;font-weight:bold;margin:22px 0 10px}.hint{color:#69738d;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:24px 0}.choice{border:2px solid #ddd8ff;background:#f8f6ff;color:#34305b;border-radius:17px;padding:19px 8px;font: bold 23px Tahoma,Arial;cursor:pointer;transition:.15s}.choice:hover:not(:disabled){transform:translateY(-2px);border-color:#9a7cf2;background:#eee8ff}.choice:disabled{cursor:default}.correct{background:#d5fae8!important;border-color:#2dc789!important}.wrong{background:#ffe0e4!important;border-color:#f16c82!important}.feedback{min-height:36px;font-weight:bold;font-size:18px}.btn{background:#7355d6;color:white;border:0;border-radius:15px;padding:14px 30px;font:bold 17px Tahoma;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.footer{margin-top:24px;font-size:14px;color:#68617b}.hide{display:none}.name-input{width:min(100%,360px);padding:15px;border:2px solid #b6a4ee;border-radius:14px;font:18px Tahoma;text-align:center;margin:16px auto;display:block}.name-input:focus{outline:3px solid #e6ddff}.welcome{padding:24px 0}.feedback{line-height:1.9}@media(max-width:480px){.wrap{margin:6px auto;padding:9px}.panel{padding:17px 12px}.choice{font-size:19px;padding:18px 3px}.question{font-size:20px}}</style></head><body><main class="wrap"><section class="panel"><h1>🌟 ماجراجویی واژه‌ها 🌟</h1><div class="sub">بازی شناخت املای درست کلمات | فارسی پایه سوم ابتدایی</div><div id="status" class="hide"><span class="badge" id="student"></span><span class="badge" id="counter">سؤال ۱ از ۲۲</span><span class="badge" id="score">⭐ امتیاز: ۰</span></div><div id="welcome" class="welcome"><h2>🎈 آماده‌ای واژه‌ها را کشف کنی؟</h2><label for="studentName">نام دانش‌آموز:</label><input id="studentName" class="name-input" type="text" maxlength="45" autocomplete="name" placeholder="نام خود را اینجا بنویس"><div id="nameError" class="feedback" aria-live="polite"></div><button class="btn" id="start">شروع بازی 🚀</button></div><div class="progress hide" id="progress"><div class="bar" id="bar"></div></div><div id="game" class="hide"><div class="question">کدام واژه درست نوشته شده است؟</div><div class="hint">روی گزینه‌ای که املای درست دارد بزن.</div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn" id="next" disabled>سؤال بعدی ←</button></div><div id="finish" class="hide"><h2>🎉 آفرین! بازی تمام شد!</h2><p id="result"></p><button class="btn" onclick="restart()">🔄 بازی دوباره</button></div><div class="footer">✍️ طراح: سعیده محمودیان</div></section></main><script>
const items=[
['ثبت‌نام','سبت‌نام','ثبت‌نام','ثبت‌نام'],['ناراحت','ناراهت','ناراحت','ناراحط'],['مغازه','مقازه','مغازه','مغاذه'],['دروازه‌بان','دروازه‌بان','دروازه‌بان','دروازه‌بان'],['عظمت','عضمت','عظمت','ازمت'],['موضوع','موظوع','موضوع','موزوع'],['بحث','بخس','بحث','بحص'],['نظر','نزر','نظر','نضر'],['بعضی','بعزی','بعضی','بعضی'],['ماهرانه','ماهرانه','ماهرانه','ماحرانه'],['محله','مهله','محله','محلّه'],['عادت','آدت','عادت','عادط'],['علاقه','الاقه','علاقه','علاخه'],['آغاز','آقاز','آغاز','آغاذ'],['نظم','نزم','نظم','نضم'],['مخصوص','مخسوس','مخصوص','مخثوص'],['محیط','مهیط','محیط','محیت'],['آشغال','آشقال','آشغال','آشغال'],['دل‌پذیر','دل‌پزیر','دل‌پذیر','دل‌پزیر'],['غرق','قرق','غرق','غرق'],['نشاط','نشات','نشاط','نشاط'],['طبیعت','تبیعت','طبیعت','طبیعط']];
// Each question presents one correct answer and three deliberately misspelled alternatives.
const questions=[
['ثبت‌نام','سبت نام','ثبت‌نامم','سبط نام'],['ناراحت','ناراهت','ناراحط','ناراحت'],['مغازه','مقازه','مغاذه','مغازه'],['دروازه‌بان','دروازه بانن','دروازه‌بان','دروازه‌بانن'],['عظمت','عضمت','ازمت','عظمت'],['موضوع','موظوع','موزوع','موضوع'],['بحث','بخس','بحص','بحث'],['نظر','نزر','نضر','نظر'],['بعضی','بعزی','بعضی','بعظی'],['ماهرانه','ماحرانه','ماهرانه','ماهرانح'],['محله','مهله','محله','محلح'],['عادت','آدت','عادط','عادت'],['علاقه','الاقه','علاخه','علاقه'],['آغاز','آقاز','آغاذ','آغاز'],['نظم','نزم','نضم','نظم'],['مخصوص','مخسوس','مخثوص','مخصوص'],['محیط','مهیط','محیت','محیط'],['آشغال','آشقال','آشغال','آشقالل'],['دل‌پذیر','دل‌پزیر','دل‌پذیر','دل‌پزیرر'],['غرق','قرق','غرق','غرقق'],['نشاط','نشات','نشاط','نشاطط'],['طبیعت','تبیعت','طبیعط','طبیعت']].map(([answer,...options])=>({answer,options: [...new Set([answer,...options])]}));
let order=[],index=0,points=0,answered=false,studentName="";const cheers=["🌟 آفرین! چه خوب بلدی!","👏 عالی بود! ادامه بده!","🎉 احسنت! درست گفتی!","🏆 تو یک قهرمان واژه‌هایی!","💐 هزار آفرین!","✨ چه انتخاب درخشانی!","🥳 فوق‌العاده بود!","🌈 درست و زیبا انتخاب کردی!"];const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function restart(){order=shuffle(questions);index=0;points=0;$('finish').classList.add('hide');$('game').classList.remove('hide');render()}function render(){answered=false;let q=order[index];$('counter').textContent=`سؤال ${index+1} از ${order.length}`;$('score').textContent=`⭐ امتیاز: ${points}`;$('bar').style.width=`${index/order.length*100}%`;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===order.length-1?'دیدن نتیجه 🏆':'سؤال بعدی ←';let box=$('choices');box.innerHTML='';shuffle(q.options).forEach(option=>{let b=document.createElement('button');b.className='choice';b.textContent=option;b.onclick=()=>choose(option,b);box.appendChild(b)})}function choose(option,button){if(answered)return;answered=true;let q=order[index];let ok=option===q.answer;if(ok)points+=10;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');else if(b===button)b.classList.add('wrong')});$('feedback').textContent=ok?cheers[Math.floor(Math.random()*cheers.length)]:`💡 پاسخ درست: ${q.answer}`;$('score').textContent=`⭐ امتیاز: ${points}`;$('next').disabled=false}$('next').onclick=()=>{index++;if(index<order.length)render();else{$('game').classList.add('hide');$('finish').classList.remove('hide');$('bar').style.width='100%';$('counter').textContent='پایان بازی';$('result').textContent=`${studentName} عزیز، از ${order.length} سؤال، ${points/10} پاسخ درست دادی و ${points} امتیاز گرفتی!`}};$('start').onclick=()=>{const name=$('studentName').value.trim();if(!name){$('nameError').textContent='لطفاً اول نامت را بنویس 🌷';$('studentName').focus();return;}studentName=name;$('student').textContent='👧🧒 '+studentName;$('welcome').classList.add('hide');$('status').classList.remove('hide');$('progress').classList.remove('hide');restart();};$('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')$('start').click()});
</script></body></html>
